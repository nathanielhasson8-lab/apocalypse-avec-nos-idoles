name: Build Manager 27 APK
on:
  push:
    branches: [manager27-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager27-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Reconstruct exact game HTML
        run: |
          mkdir -p app/src/main/assets
          cat game_parts/part*.b64 | base64 -d > /tmp/index.html.xz
          xz -dc /tmp/index.html.xz > app/src/main/assets/index.html
          echo "50e09582b828f7c69b3f0f074dd87f2aa02172590111e430140b99e2e93b3d22  app/src/main/assets/index.html" | sha256sum -c -
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk Manager27_MSN.apk
      - name: Verify APK contains exact game
        run: |
          test -s Manager27_MSN.apk
          unzip -l Manager27_MSN.apk | grep -q 'assets/index.html'
          unzip -p Manager27_MSN.apk assets/index.html | sha256sum | grep -q '^50e09582b828f7c69b3f0f074dd87f2aa02172590111e430140b99e2e93b3d22'
      - uses: actions/upload-artifact@v4
        with:
          name: Manager27_MSN
          path: manager27-apk/Manager27_MSN.apk
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Manager27_MSN
          path: manager27-apk
      - name: Android launch and navigation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r manager27-apk/Manager27_MSN.apk
            adb shell am start -W -n com.manager27.msn/.MainActivity
            sleep 7
            test -n "$(adb shell pidof com.manager27.msn | tr -d '\r')"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window.xml >/dev/null
            grep -Eqi 'Manager 27|Effectif|CONTINUER' window.xml
            tap_text() {
              TARGET="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml window.xml >/dev/null
              COORDS=$(python3 - "$TARGET" <<'PY'
import re,sys,xml.etree.ElementTree as ET
target=sys.argv[1].lower()
root=ET.parse('window.xml').getroot()
for n in root.iter('node'):
    s=((n.get('text') or '')+' '+(n.get('content-desc') or '')).lower()
    if target in s:
        m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.get('bounds',''))
        if m:
            x1,y1,x2,y2=map(int,m.groups())
            print((x1+x2)//2,(y1+y2)//2)
            break
PY
              )
              test -n "$COORDS"
              adb shell input tap $COORDS
              sleep 2
              test -n "$(adb shell pidof com.manager27.msn | tr -d '\r')"
            }
            tap_text "Effectif"
            tap_text "Tactique"
            tap_text "CONTINUER"
            sleep 3
            test -n "$(adb shell pidof com.manager27.msn | tr -d '\r')"
            ! adb logcat -d | grep -E 'FATAL EXCEPTION.*com.manager27.msn|Process: com.manager27.msn.*FATAL EXCEPTION'
