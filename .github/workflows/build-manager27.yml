name: Build Manager 27 APK
on:
  push:
    branches: [manager27-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager27-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk Manager27_MSN.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Manager27_MSN
          path: manager27-apk/Manager27_MSN.apk
          if-no-files-found: error
