name: Build Manager 27 APK
on:
  push:
    branches:
      - manager27-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager27-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Reconstruct exact game HTML
        run: |
          mkdir -p app/src/main/assets
          cat game_parts/part*.b64 | base64 -d > /tmp/index.html.xz
          xz -dc /tmp/index.html.xz > app/src/main/assets/index.html
          echo "50e09582b828f7c69b3f0f074dd87f2aa02172590111e430140b99e2e93b3d22  app/src/main/assets/index.html" | sha256sum -c -
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk Manager27_MSN.apk
      - name: Verify APK
        run: |
          test -s Manager27_MSN.apk
          unzip -l Manager27_MSN.apk | grep -q 'assets/index.html'
          test "$(unzip -p Manager27_MSN.apk assets/index.html | sha256sum | cut -d' ' -f1)" = "50e09582b828f7c69b3f0f074dd87f2aa02172590111e430140b99e2e93b3d22"
      - uses: actions/upload-artifact@v4
        with:
          name: Manager27_MSN
          path: manager27-apk/Manager27_MSN.apk
          if-no-files-found: error
