name: Build Manager 27 APK
on:
  push:
    branches:
      - manager27-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager27-apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore exact Manager 27 game asset
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat game_parts/part*.b64 | tr -d '\r\n ' | base64 -d > /tmp/manager27-index.html.xz
          xz -dc /tmp/manager27-index.html.xz > app/src/main/assets/index.html
          echo "50e09582b828f7c69b3f0f074dd87f2aa02172590111e430140b99e2e93b3d22  app/src/main/assets/index.html" | sha256sum -c -
          test -s app/src/main/assets/index.html
          grep -qi "Manager 27" app/src/main/assets/index.html
          grep -q "CONTINUER" app/src/main/assets/index.html
          grep -qi "Effectif" app/src/main/assets/index.html
          grep -qi "Tactique" app/src/main/assets/index.html
          grep -qi "Calendrier" app/src/main/assets/index.html

      - name: Build final APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare final APK
        run: |
          set -euo pipefail
          mkdir -p export
          cp app/build/outputs/apk/debug/app-debug.apk export/Manager27_MSN.apk
          test -s export/Manager27_MSN.apk
          unzip -t export/Manager27_MSN.apk >/dev/null
          sha256sum export/Manager27_MSN.apk | tee export/Manager27_MSN.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Manager27_MSN_APK
          path: |
            manager27-apk/export/Manager27_MSN.apk
            manager27-apk/export/Manager27_MSN.sha256
          if-no-files-found: error

      - name: Install emulator image
        run: sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Android launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          echo no | avdmanager create avd -n manager27test -k "system-images;android-35;google_apis;x86_64" --force
          nohup emulator -avd manager27test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >/tmp/emulator.log 2>&1 &
          adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb install -r export/Manager27_MSN.apk
          adb logcat -c
          adb shell am start -W -n com.manager27.msn/.MainActivity
          sleep 8
          adb shell dumpsys activity activities | grep -q "com.manager27.msn/.MainActivity"
          if adb logcat -d -b crash | grep -E "FATAL EXCEPTION|AndroidRuntime"; then
            echo "Android crash detected"
            exit 1
          fi
          echo "APK launch smoke test passed"
