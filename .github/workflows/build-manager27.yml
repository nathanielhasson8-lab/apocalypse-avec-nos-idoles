name: Build Manager 27 APK
on:
  push:
    branches:
      - manager27-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager27-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare placeholder asset
        run: |
          mkdir -p app/src/main/assets
          printf '%s\n' '<!doctype html><html><body>Manager 27</body></html>' > app/src/main/assets/index.html
      - name: Build wrapper APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare signing kit
        run: |
          mkdir -p export
          cp app/build/outputs/apk/debug/app-debug.apk export/Manager27_wrapper.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" export/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" export/zipalign
          chmod +x export/zipalign
          keytool -genkeypair -noprompt -keystore export/manager27.keystore -storepass manager27 -keypass manager27 -alias manager27 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Manager 27, O=Manager27, C=FR"
          test -s export/Manager27_wrapper.apk
          test -s export/apksigner.jar
          test -x export/zipalign
          test -s export/manager27.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: Manager27_BuildKit
          path: manager27-apk/export/
          if-no-files-found: error
