app-id: com.manager27.MSN
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: manager27
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download
modules:
  - name: manager27
    buildsystem: meson
    sources:
      - type: file
        path: meson.build
      - type: file
        path: manager27.c
      - type: file
        path: index.html
      - type: file
        path: com.manager27.MSN.desktop
      - type: file
        path: com.manager27.MSN.svg
      - type: file
        path: com.manager27.MSN.metainfo.xml
